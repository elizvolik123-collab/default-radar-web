<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f6f8"><title>Дефолт-радар · Аналитика облигаций</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><script src="pages.js" defer></script><script src="app.js" defer></script></head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="./" aria-label="Дефолт-радар, главная"><img src="favicon.svg" alt="">Дефолт<span>-радар</span></a>
<nav aria-label="Разделы"><button data-tab="market"><span class="ico" data-i="chart"></span>Рынок облигаций</button><button data-tab="chat"><span class="ico" data-i="chat"></span>Спросить агента</button></nav>
<button class="lab" id="about"><i></i>Учебный прототип</button></div></header>
<main class="wrap">
<div class="page-head"><div><h1 id="pageTitle">Рынок облигаций</h1><p id="subtitle">Выпуски, платежи и кредитные события</p></div><div class="date-wrap"><label for="asof">Дата анализа <span>· МСК</span></label><input type="date" id="asof" value="2026-04-08"></div></div>
<div id="notice" role="status"></div>
<section id="market"><div class="searchrow"><label class="search"><span class="ico" data-i="search"></span><input id="query" type="search" placeholder="Найти облигацию по названию, серии или ISIN" autocomplete="off" aria-label="Поиск облигаций"><kbd>/</kbd></label><button class="outline" id="catalogBtn"><span class="ico" data-i="filter"></span>Каталог</button></div>
<section id="catalog" class="panel hide"><div class="section-head"><div><h2>Каталог выпусков</h2><p id="count"></p></div><button class="iconbtn" aria-label="Закрыть каталог" id="closeCatalog">×</button></div>
<div class="filters"><label>Эмитент<input id="issuer" placeholder="Название или ИНН"></label><label>Валюта<select id="currency"><option value="">Все валюты</option><option>RUB</option><option>USD</option><option>EUR</option><option>CNY</option></select></label><label>Обращение<select id="status"><option value="">Все статусы</option><option>В обращении</option><option>Архив</option><option>Нет сведений</option></select></label><label class="check"><input id="eventFilter" type="checkbox">Есть платёжное событие</label></div><div id="results" aria-live="polite"></div><div class="pager" id="pager"></div></section>
<div id="marketHome"></div>
<section id="detail" aria-live="polite"><p class="loading">Загружаем сохранённый срез…</p></section></section>
<section id="chat" class="hide"><div id="chatContext"></div><div id="dialogue" aria-live="polite"></div><form id="askForm"><textarea id="question" maxlength="2000" rows="2" placeholder="Задайте вопрос об облигации или платеже…" aria-label="Вопрос агенту"></textarea><button type="submit" class="primary" title="Отправить вопрос" aria-label="Отправить вопрос"><span class="ico" data-i="up"></span></button></form><p id="mode" class="sub"></p></section>
<footer><span><i></i> Дефолт-радар</span><button id="coverageBtn">Источники и покрытие <span aria-hidden="true">↗</span></button></footer>
</main>
<dialog id="modal"><div class="section-head"><h2 id="modalTitle"></h2><button id="closeModal" class="iconbtn" aria-label="Закрыть">×</button></div><div id="modalBody"></div></dialog>
</body></html>
