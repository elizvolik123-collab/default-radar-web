name: Publish bond radar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '25 19 * * 1-5'
concurrency:
  group: bond-radar-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Prepare site and data
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            python3 .github/feeds/refresh_site.py --refresh
          else
            python3 .github/feeds/refresh_site.py
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
